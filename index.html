 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NTMY – For You</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#030208;font-family:system-ui,-apple-system,sans-serif}
  #canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #intro{
    position:fixed;inset:0;z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#1a0a18 0%,#030208 70%);
    transition:opacity 1.8s cubic-bezier(.4,0,.2,1),visibility 1.8s;
    padding:24px;text-align:center;pointer-events:auto
  }
  #intro.hide{opacity:0;visibility:hidden;pointer-events:none}
  .intro-msg{
    max-width:560px;color:#ffc1d4;
    font-size:clamp(17px,4.2vw,24px);line-height:1.75;letter-spacing:.3px;
    text-shadow:0 0 28px rgba(255,140,180,.55);
    margin-bottom:48px;animation:fadeUp 1.6s ease both
  }
  .intro-msg .heart{display:inline-block;animation:heartbeat 1.7s ease-in-out infinite}
  @keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
  @keyframes heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.3)}28%{transform:scale(1)}42%{transform:scale(1.18)}}
  #seeBtn{
    background:linear-gradient(135deg,#ff4d7a,#ff9ec0);border:none;color:#fff;
    font-size:18px;font-weight:500;letter-spacing:2px;padding:18px 46px;border-radius:50px;
    cursor:pointer;box-shadow:0 0 40px rgba(255,80,130,.65),0 12px 28px rgba(0,0,0,.4);
    transition:transform .3s,box-shadow .3s;animation:fadeUp 1.9s ease both
  }
  #seeBtn:hover{transform:scale(1.07);box-shadow:0 0 55px rgba(255,80,130,.85),0 14px 32px rgba(0,0,0,.45)}
  #seeBtn:active{transform:scale(.96)}
  #roseMsg{
    position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:60;
    background:rgba(18,6,16,.82);backdrop-filter:blur(14px);
    border:1px solid rgba(255,120,160,.45);color:#ffc1d4;font-size:15px;
    padding:14px 30px;border-radius:40px;cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity 1.2s,transform .4s;box-shadow:0 0 32px rgba(255,80,130,.35);white-space:nowrap
  }
  #roseMsg.show{opacity:1;pointer-events:auto}
  #roseMsg:hover{transform:translateX(-50%) scale(1.06);box-shadow:0 0 45px rgba(255,80,130,.55)}
  #finalText{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
    z-index:70;color:#fff;font-size:clamp(28px,6vw,48px);font-weight:500;
    letter-spacing:3px;text-shadow:0 0 40px rgba(255,100,150,.9),0 0 80px rgba(255,60,100,.5);
    opacity:0;pointer-events:none;transition:opacity 2s,transform 2.5s cubic-bezier(.2,.8,.2,1)
  }
  #finalText.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #loading{position:fixed;inset:0;z-index:200;background:#030208;display:flex;align-items:center;justify-content:center;color:#ff9ec0;font-size:14px;letter-spacing:2px}
  #loading.hide{opacity:0;pointer-events:none;transition:opacity .8s}
</style>
</head>
<body>
<div id="loading">Loading garden…</div>
<div id="intro">
  <div class="intro-msg">
    Hi Cutiee <span class="heart">💕</span><br>
    I just met you and talked to you,<br>
    so I just told you NTMY…<br>
    but where are the flowers?
  </div>
  <button id="seeBtn">✨ See Flowers ✨</button>
</div>
<div id="roseMsg">🌹 I think you're missing a rose? Click here</div>
<div id="finalText">Just for You ❤️</div>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

<script>
const MUSIC_URL = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";

const canvas = document.getElementById('canvas');
const intro = document.getElementById('intro');
const seeBtn = document.getElementById('seeBtn');
const roseMsg = document.getElementById('roseMsg');
const finalText = document.getElementById('finalText');
const loading = document.getElementById('loading');

let scene, camera, renderer, controls, composer, bloomPass;
let clock = new THREE.Clock();
let flowers = [];
let specialRoses = [];
let particles = [];
let insects = [];
let grassMeshes = [];
let started = false;
let rosesPhase = false;
let finalPhase = false;
let mainBloomDone = false;
let cameraLookAt = new THREE.Vector3(0, 1.0, 0);

/* ---------- RENDERER & SCENE ---------- */
function initRenderer() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  // Cap pixel ratio to 1.5 for performance boost
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap; // Faster shadow mapping
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
}

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030208);
  scene.fog = new THREE.FogExp2(0x0a0610, 0.018);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 4.5, 14);

  controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 3;
  controls.maxDistance = 28;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.target.copy(cameraLookAt);
  controls.enabled = false;
}

/* ---------- LIGHTING ---------- */
function initLights() {
  const moon = new THREE.DirectionalLight(0xb8c4ff, 1.2);
  moon.position.set(-8, 18, 6);
  moon.castShadow = true;
  moon.shadow.mapSize.set(1024, 1024); // Lowered shadow map size for low-end GPUs
  scene.add(moon);

  const fill = new THREE.DirectionalLight(0xff9ec0, 0.35);
  fill.position.set(6, 8, -4);
  scene.add(fill);

  scene.add(new THREE.AmbientLight(0x1a1020, 0.5));
}

/* ---------- POST PROCESSING ---------- */
function initPost() {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));

  bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2), // Half resolution bloom pass
    0.45,  // bloom strength
    0.4,   // radius
    0.85   // threshold
  );
  composer.addPass(bloomPass);
}

/* ---------- GROUND & GRASS ---------- */
function createGround() {
  const groundGeo = new THREE.CircleGeometry(22, 32);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a120e, roughness: 0.95 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const bladeGeo = new THREE.PlaneGeometry(0.04, 0.35);
  bladeGeo.translate(0, 0.175, 0);
  const bladeMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, side: THREE.DoubleSide, roughness: 0.8 });
  
  const grassCount = 1000; // Optimized count
  const grass = new THREE.InstancedMesh(bladeGeo, bladeMat, grassCount);

  const dummy = new THREE.Object3D();
  for (let i = 0; i < grassCount; i++) {
    const r = Math.sqrt(Math.random()) * 18;
    const theta = Math.random() * Math.PI * 2;
    dummy.position.set(Math.cos(theta) * r, 0, Math.sin(theta) * r);
    dummy.rotation.y = Math.random() * Math.PI;
    dummy.rotation.z = (Math.random() - 0.5) * 0.4;
    dummy.scale.setScalar(0.7 + Math.random() * 0.8);
    dummy.updateMatrix();
    grass.setMatrixAt(i, dummy.matrix);
  }
  grass.instanceMatrix.needsUpdate = true;
  scene.add(grass);
}

/* ---------- PARTICLES ---------- */
function createParticles() {
  const fireflyCount = 50;
  const pos = new Float32Array(fireflyCount * 3);
  const phases = [];
  for (let i = 0; i < fireflyCount; i++) {
    pos[i*3] = (Math.random()-0.5)*30;
    pos[i*3+1] = 0.5 + Math.random()*4;
    pos[i*3+2] = (Math.random()-0.5)*30;
    phases.push(Math.random()*Math.PI*2);
  }
  const fireflyGeo = new THREE.BufferGeometry();
  fireflyGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const fireflies = new THREE.Points(
    fireflyGeo,
    new THREE.PointsMaterial({ color: 0xffe082, size: 0.1, transparent: true, opacity: 0.8 })
  );
  fireflies.userData = { phases, type: 'firefly' };
  scene.add(fireflies);
  particles.push(fireflies);
}

/* ---------- INSECTS ---------- */
function createInsects() {
  const wingGeo = new THREE.PlaneGeometry(0.18, 0.12);
  const bodyGeo = new THREE.SphereGeometry(0.04, 4, 4);

  for (let i = 0; i < 6; i++) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(bodyGeo, new THREE.MeshBasicMaterial({ color: 0xffd54f }));
    group.add(body);

    const wingMat = new THREE.MeshBasicMaterial({ color: 0xce93d8, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
    const wingL = new THREE.Mesh(wingGeo, wingMat);
    wingL.position.set(-0.08, 0.02, 0);
    const wingR = wingL.clone();
    wingR.position.x = 0.08;
    group.add(wingL, wingR);

    group.userData = {
      wingL, wingR,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.4,
      radius: 4 + Math.random() * 6,
      height: 1.2 + Math.random() * 2,
      center: new THREE.Vector3((Math.random()-0.5)*10, 0, (Math.random()-0.5)*10)
    };
    scene.add(group);
    insects.push(group);
  }
}

/* ---------- FLOWERS ---------- */
function createPetalShape(type, scale = 1) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.15*scale, 0.1*scale, 0.25*scale, 0.4*scale, 0.05*scale, 0.7*scale);
  shape.bezierCurveTo(-0.1*scale, 0.55*scale, -0.2*scale, 0.25*scale, 0, 0);
  return shape;
}

const sharedPetalGeo = new THREE.ShapeGeometry(createPetalShape('rose'));

function createFlower(type, colorDeep, colorMid, colorLight, x, z, delay, heightScale = 1) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);

  const baseHeight = 0.9 + Math.random() * 0.6 * heightScale;
  const petalCount = 8; // Reduced petal count for speed

  group.userData = {
    type, delay, progress: 0, grown: false,
    swayPhase: Math.random() * Math.PI * 2,
    swaySpeed: 0.6 + Math.random() * 0.8,
    baseHeight, petalCount
  };

  const stemGeo = new THREE.CylinderGeometry(0.02, 0.03, baseHeight, 5);
  stemGeo.translate(0, baseHeight / 2, 0);
  const stem = new THREE.Mesh(stemGeo, new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 }));
  group.add(stem);
  group.userData.stem = stem;

  const head = new THREE.Group();
  head.position.y = baseHeight;
  group.add(head);
  group.userData.head = head;

  // Single shared material for flower petals
  const petalMat = new THREE.MeshStandardMaterial({
    color: colorMid,
    roughness: 0.5,
    side: THREE.DoubleSide,
    transparent: true
  });

  for (let i = 0; i < petalCount; i++) {
    const petal = new THREE.Mesh(sharedPetalGeo, petalMat);
    const angle = (i / petalCount) * Math.PI * 2;
    petal.position.set(Math.cos(angle)*0.02, 0.02, Math.sin(angle)*0.02);
    petal.rotation.y = angle;
    petal.scale.setScalar(0);
    head.add(petal);
  }

  const center = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffd54f }));
  center.position.y = 0.04;
  center.scale.setScalar(0);
  head.add(center);
  group.userData.center = center;

  const bud = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), new THREE.MeshBasicMaterial({ color: colorDeep }));
  bud.position.y = 0.08;
  bud.scale.setScalar(0);
  head.add(bud);
  group.userData.bud = bud;

  group.scale.setScalar(0);
  scene.add(group);
  return group;
}

function buildGarden() {
  let delay = 0;
  for (let i = 0; i < 20; i++) {
    const r = 2.5 + Math.random() * 8;
    const theta = Math.random() * Math.PI * 2;
    const f = createFlower('rose', 0x9b0a0a, 0xec407a, 0xf8bbd0, Math.cos(theta) * r, Math.sin(theta) * r, delay);
    flowers.push(f);
    delay += 0.4;
  }
}

function createSpecialRoses() {
  const positions = [[-2, 0, 1.5], [-0.8, 0, 2.8], [0.9, 0, 2.2], [2, 0, 1.0], [0, 0, 0.6]];
  positions.forEach((p, i) => {
    const f = createFlower('rose', 0x8b0000, 0xd32f2f, 0xef9a9a, p[0], p[2], i * 1.2, 1.2);
    specialRoses.push(f);
  });
}

/* ---------- ANIMATION LOOP ---------- */
function updateGrowth(flower, dt) {
  const ud = flower.userData;
  if (ud.grown) return;

  ud.progress += dt * 0.5;
  const p = Math.min(1, ud.progress);

  flower.scale.setScalar(p);
  ud.stem.scale.y = p;

  if (p > 0.4) {
    const openP = (p - 0.4) / 0.6;
    ud.head.children.forEach((child) => {
      if (child !== ud.bud && child !== ud.center) {
        child.scale.setScalar(openP * 0.8);
      }
    });
    ud.center.scale.setScalar(openP);
  }

  if (p >= 1) ud.grown = true;
}

let rosesPhaseStart = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  const t = clock.getElapsedTime();

  if (started) {
    flowers.forEach(f => { if (t > f.userData.delay) updateGrowth(f, dt); });

    if (rosesPhase) {
      specialRoses.forEach(f => { if (t > f.userData.delay + rosesPhaseStart) updateGrowth(f, dt); });
    }

    insects.forEach(ins => {
      const ud = ins.userData;
      const angle = t * ud.speed + ud.phase;
      ins.position.x = ud.center.x + Math.cos(angle) * ud.radius * 0.4;
      ins.position.z = ud.center.z + Math.sin(angle) * ud.radius * 0.4;
      ins.position.y = ud.height + Math.sin(t * 2 + ud.phase) * 0.2;
      ins.wingL.rotation.z = Math.sin(t * 15) * 0.5;
      ins.wingR.rotation.z = -Math.sin(t * 15) * 0.5;
    });

    if (finalPhase && specialRoses[2]) {
      const bigRose = specialRoses[2];
      camera.position.lerp(new THREE.Vector3().copy(bigRose.position).add(new THREE.Vector3(0, 1.6, 2.8)), 0.02);
      controls.target.lerp(bigRose.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 0.02);
    }

    controls.update();
  }

  if (!mainBloomDone && started && t > 18) {
    mainBloomDone = true;
    roseMsg.classList.add('show');
  }

  composer.render();
}

/* ---------- EVENTS ---------- */
seeBtn.addEventListener('click', () => {
  intro.classList.add('hide');
  started = true;
  controls.enabled = true;
  new Audio(MUSIC_URL).play().catch(()=>{});
});

roseMsg.addEventListener('click', () => {
  if (rosesPhase) return;
  rosesPhase = true;
  rosesPhaseStart = clock.getElapsedTime();
  roseMsg.classList.remove('show');
  createSpecialRoses();

  setTimeout(() => {
    finalPhase = true;
    setTimeout(() => finalText.classList.add('show'), 3000);
  }, 8000);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- BOOT ---------- */
function boot() {
  initRenderer();
  initScene();
  initLights();
  initPost();
  createGround();
  createParticles();
  createInsects();
  buildGarden();
  loading.classList.add('hide');
  animate();
}
boot();
</script>
</body>
</html>
