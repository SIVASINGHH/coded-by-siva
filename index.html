 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NTMY 🌷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030208;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a0a18 0%, #030208 70%);
    transition: opacity 1.3s ease, visibility 1.3s;
    padding: 24px;
    text-align: center;
  }
  #intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .msg {
    max-width: 540px;
    color: #ffc1d4;
    font-size: clamp(16px, 4.1vw, 22px);
    line-height: 1.75;
    letter-spacing: 0.3px;
    text-shadow: 0 0 22px rgba(255, 158, 192, 0.5);
    margin-bottom: 42px;
    animation: fadeUp 1.5s ease both;
  }
  .msg .heart {
    display: inline-block;
    animation: heartbeat 1.6s ease-in-out infinite;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14%      { transform: scale(1.28); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.16); }
  }

  #seeBtn {
    background: linear-gradient(135deg, #ff4d7a, #ff9ec0);
    border: none;
    color: #fff;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 1.6px;
    padding: 17px 42px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 32px rgba(255, 80, 130, 0.6), 0 10px 24px rgba(0,0,0,0.35);
    transition: transform 0.25s, box-shadow 0.25s;
    animation: fadeUp 1.7s ease both;
  }
  #seeBtn:hover {
    transform: scale(1.07);
    box-shadow: 0 0 45px rgba(255, 80, 130, 0.8), 0 12px 28px rgba(0,0,0,0.4);
  }
  #seeBtn:active { transform: scale(0.96); }

  /* Rose message */
  #roseMsg {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    background: rgba(20, 8, 18, 0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 120, 160, 0.35);
    color: #ffc1d4;
    font-size: 15px;
    padding: 12px 26px;
    border-radius: 40px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease, transform 0.4s;
    box-shadow: 0 0 25px rgba(255, 80, 130, 0.25);
    white-space: nowrap;
  }
  #roseMsg.show {
    opacity: 1;
    pointer-events: auto;
  }
  #roseMsg:hover {
    transform: translateX(-50%) scale(1.05);
    box-shadow: 0 0 35px rgba(255, 80, 130, 0.45);
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    font-size: 15px;
    opacity: 0;
    animation: floatSparkle 7s linear infinite;
  }
  @keyframes floatSparkle {
    0%   { transform: translateY(105vh) rotate(0deg); opacity: 0; }
    12%  { opacity: 0.75; }
    88%  { opacity: 0.5; }
    100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<div id="intro">
  <div class="msg">
    Hi cutiee i am siva <span class="heart">💕</span><br>
    I just met you and talked to you,<br>
    so I just told you <b>NTMY</b>…<br>
    but where are the flowers? 🌷
  </div>
  <button id="seeBtn">See Flowers ✨</button>
</div>

<div id="roseMsg">I think you're missing a rose? Click here 🌹</div>

<canvas id="c"></canvas>

<audio id="music" loop preload="auto">
  <source src="tere-liye.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const music = document.getElementById('music');
const intro = document.getElementById('intro');
const seeBtn = document.getElementById('seeBtn');
const roseMsg = document.getElementById('roseMsg');

let W, H;
const particles = [];
const flowers = [];
const roses = [];          // special realistic roses
let started = false;
let rosesStarted = false;
let roseStartT = 0;
let mainDone = false;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* soft floating particles */
class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 40;
    this.r = 1.0 + Math.random() * 2.8;
    this.speed = 0.18 + Math.random() * 0.5;
    this.a = 0.07 + Math.random() * 0.22;
    this.col = Math.random() > 0.38 ? '#ff9ec0' : '#ffe0ec';
    this.wobble = Math.random() * Math.PI * 2;
  }
  update() {
    this.y -= this.speed;
    this.x += Math.sin(this.wobble + this.y * 0.008) * 0.35;
    if (this.y < -40) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.col;
    ctx.globalAlpha = this.a;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}
for (let i = 0; i < 60; i++) particles.push(new Particle());

/* normal garden presets */
const PRESETS = [
  { petalDeep: '#e91e63', petalMid: '#ff80ab', petalLight: '#ffc1d4', bud: '#f48fb1', core: '#ffd54f', glow: 'rgba(255,70,130,0.55)' },
  { petalDeep: '#ce93d8', petalMid: '#f3e5f5', petalLight: '#faf5ff', bud: '#e1bee7', core: '#fff', glow: 'rgba(220,180,255,0.5)' },
  { petalDeep: '#ad1457', petalMid: '#ec407a', petalLight: '#f8bbd0', bud: '#f06292', core: null, glow: 'rgba(180,30,90,0.55)' },
  { petalDeep: '#ef6c00', petalMid: '#ffb300', petalLight: '#ffe082', bud: '#ff8f00', core: '#4e342e', glow: 'rgba(255,150,0,0.45)' },
  { petalDeep: '#7b1fa2', petalMid: '#ba68c8', petalLight: '#e1bee7', bud: '#ce93d8', core: '#ffd54f', glow: 'rgba(150,60,200,0.5)' },
  { petalDeep: '#e57373', petalMid: '#ef9a9a', petalLight: '#ffcdd2', bud: '#ef9a9a', core: '#fff59d', glow: 'rgba(255,120,120,0.5)' },
  { petalDeep: '#f06292', petalMid: '#f8bbd0', petalLight: '#fce4ec', bud: '#f48fb1', core: '#ffecb3', glow: 'rgba(240,100,150,0.5)' }
];

/* special realistic rose presets (more red/pink/classic) */
const ROSE_PRESETS = [
  { // classic deep red rose
    petalDeep: '#b71c1c', petalMid: '#e53935', petalLight: '#ef9a9a',
    bud: '#c62828', core: '#ffd54f', glow: 'rgba(200,30,40,0.6)'
  },
  { // romantic pink rose
    petalDeep: '#c2185b', petalMid: '#f06292', petalLight: '#f8bbd0',
    bud: '#ec407a', core: '#ffecb3', glow: 'rgba(220,50,100,0.55)'
  },
  { // soft peach rose
    petalDeep: '#e91e63', petalMid: '#f48fb1', petalLight: '#fce4ec',
    bud: '#f06292', core: '#fff59d', glow: 'rgba(240,80,130,0.5)'
  },
  { // deep burgundy
    petalDeep: '#880e4f', petalMid: '#ad1457', petalLight: '#f48fb1',
    bud: '#c2185b', core: '#ffd54f', glow: 'rgba(160,20,70,0.55)'
  },
  { // soft coral rose
    petalDeep: '#d32f2f', petalMid: '#ef5350', petalLight: '#ffcdd2',
    bud: '#e57373', core: '#fff8e1', glow: 'rgba(230,60,60,0.5)'
  }
];

const STAGE = { root: 0.0, stem: 0.4, leaf: 1.55, bud: 2.5, open: 3.3 };

function createFlower(cfg, isRose = false) {
  return {
    cx: cfg.x,
    base: 0.93,
    maxH: cfg.h,
    ang: cfg.ang * Math.PI / 180,
    delay: cfg.delay,
    preset: isRose ? ROSE_PRESETS[cfg.p % ROSE_PRESETS.length] : PRESETS[cfg.p % PRESETS.length],
    petals: cfg.petals || 6,
    isTulip: cfg.tulip || false,
    isSun: cfg.sun || false,
    isRose: isRose,
    sway: 0.12 + Math.random() * 0.28,
    swaySpeed: 0.55 + Math.random() * 0.7,
    phase: Math.random() * Math.PI * 2
  };
}

/* normal garden layout */
const LAYOUT = [
  { x: 0.07, h: 0.40, delay: 0.0,  ang: -30, p: 0, petals: 7 },
  { x: 0.17, h: 0.52, delay: 1.1,  ang: -20, p: 3, petals: 16, sun: true },
  { x: 0.27, h: 0.46, delay: 2.3,  ang: -12, p: 1, petals: 6 },
  { x: 0.37, h: 0.58, delay: 3.5,  ang: -5,  p: 2, petals: 3, tulip: true },
  { x: 0.47, h: 0.64, delay: 4.7,  ang: 0,   p: 0, petals: 8 },
  { x: 0.57, h: 0.50, delay: 5.9,  ang: 7,   p: 4, petals: 6 },
  { x: 0.67, h: 0.56, delay: 7.1,  ang: 13,  p: 5, petals: 7 },
  { x: 0.77, h: 0.44, delay: 8.3,  ang: 20,  p: 1, petals: 6 },
  { x: 0.87, h: 0.48, delay: 9.5,  ang: 27,  p: 6, petals: 7 },
  { x: 0.13, h: 0.32, delay: 10.8, ang: -24, p: 2, petals: 3, tulip: true },
  { x: 0.31, h: 0.30, delay: 12.0, ang: -9,  p: 0, petals: 6 },
  { x: 0.51, h: 0.34, delay: 13.2, ang: 5,   p: 3, petals: 14, sun: true },
  { x: 0.71, h: 0.31, delay: 14.4, ang: 16,  p: 5, petals: 6 },
  { x: 0.41, h: 0.38, delay: 15.6, ang: -3,  p: 6, petals: 7 },
  { x: 0.61, h: 0.36, delay: 16.8, ang: 11,  p: 0, petals: 6 },
  { x: 0.22, h: 0.26, delay: 18.0, ang: -15, p: 4, petals: 5 },
  { x: 0.82, h: 0.28, delay: 19.2, ang: 22,  p: 1, petals: 6 }
];
LAYOUT.forEach(l => flowers.push(createFlower(l)));

/* special realistic roses layout (appear after click) */
const ROSE_LAYOUT = [
  { x: 0.18, h: 0.55, delay: 0.0,  ang: -18, p: 0, petals: 9 },
  { x: 0.32, h: 0.62, delay: 1.4,  ang: -8,  p: 1, petals: 10 },
  { x: 0.48, h: 0.68, delay: 2.8,  ang: 0,   p: 2, petals: 11 },
  { x: 0.64, h: 0.60, delay: 4.2,  ang: 9,   p: 3, petals: 10 },
  { x: 0.78, h: 0.52, delay: 5.6,  ang: 18,  p: 4, petals: 9 },
  { x: 0.25, h: 0.40, delay: 7.0,  ang: -12, p: 0, petals: 8 },
  { x: 0.55, h: 0.42, delay: 8.4,  ang: 6,   p: 1, petals: 9 },
  { x: 0.72, h: 0.38, delay: 9.8,  ang: 15,  p: 2, petals: 8 }
];

function ease(t) {
  return t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);
}
function easeBack(t) {
  const c = 1.7;
  return t <= 0 ? 0 : t >= 1 ? 1 : 1 + c * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
}

/* root */
function drawRoot(f, p) {
  if (p <= 0) return;
  const x = f.cx * W, y = f.base * H;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(f.ang);
  const s = ease(p) * 18;
  const soil = ctx.createRadialGradient(0, 4, 2, 0, 6, s * 1.8);
  soil.addColorStop(0, 'rgba(70, 45, 35, 0.85)');
  soil.addColorStop(1, 'rgba(40, 25, 20, 0.0)');
  ctx.beginPath();
  ctx.ellipse(0, 6, s * 1.7, s * 0.65, 0, 0, Math.PI * 2);
  ctx.fillStyle = soil;
  ctx.fill();
  ctx.strokeStyle = 'rgba(65, 40, 35, 0.7)';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8, 4); ctx.quadraticCurveTo(-14, 15, -6, 22);
  ctx.moveTo(7, 5);  ctx.quadraticCurveTo(15, 14, 8, 21);
  ctx.moveTo(0, 3);  ctx.quadraticCurveTo(3, 16, -2, 24);
  ctx.stroke();
  ctx.restore();
}

/* stem + leaves */
function drawStemAndLeaves(f, stemP, leafP, time) {
  const h = f.maxH * H * ease(stemP);
  if (h < 2) return { tipX: f.cx * W, tipY: f.base * H };

  const sway = Math.sin(time * f.swaySpeed + f.phase) * f.sway * (h / (f.maxH * H));
  const x = f.cx * W, y = f.base * H;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(f.ang + sway * 0.18);

  const stemGrad = ctx.createLinearGradient(0, 0, 0, -h);
  stemGrad.addColorStop(0, '#1b5e20');
  stemGrad.addColorStop(0.4, '#2e7d32');
  stemGrad.addColorStop(1, '#66bb6a');

  ctx.beginPath();
  ctx.moveTo(-2.2, 0);
  ctx.quadraticCurveTo(6 * Math.sin(f.ang * 1.3 + sway), -h * 0.5, -1.5 + sway * 3, -h);
  ctx.lineTo(1.5 + sway * 3, -h);
  ctx.quadraticCurveTo(8 * Math.sin(f.ang * 1.3 + sway), -h * 0.5, 2.2, 0);
  ctx.closePath();
  ctx.fillStyle = stemGrad;
  ctx.shadowColor = 'rgba(60, 140, 60, 0.4)';
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.moveTo(0.8, 0);
  ctx.quadraticCurveTo(3, -h * 0.5, 0.5 + sway * 2, -h);
  ctx.strokeStyle = 'rgba(180, 230, 160, 0.35)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  if (leafP > 0) {
    const leaves = [
      { pos: 0.70, side: -1, size: 1.1, rot: 0.72 },
      { pos: 0.52, side:  1, size: 1.0, rot: 0.68 },
      { pos: 0.36, side: -1, size: 0.85, rot: 0.75 },
      { pos: 0.24, side:  1, size: 0.72, rot: 0.65 }
    ];
    leaves.forEach((L, i) => {
      const lp = Math.max(0, Math.min(1, (leafP - i * 0.11) / 0.42));
      if (lp <= 0) return;
      const ly = -h * L.pos;
      const sc = ease(lp) * L.size;
      ctx.save();
      ctx.translate(sway * 2.5, ly);
      ctx.rotate(L.side * L.rot * sc);

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(L.side * 10 * sc, -6 * sc, L.side * 26 * sc, 4 * sc, L.side * 22 * sc, 14 * sc);
      ctx.bezierCurveTo(L.side * 14 * sc, 10 * sc, L.side * 6 * sc, 5 * sc, 0, 0);
      const lg = ctx.createLinearGradient(0, 0, L.side * 22 * sc, 10 * sc);
      lg.addColorStop(0, '#a5d6a7');
      lg.addColorStop(0.5, '#66bb6a');
      lg.addColorStop(1, '#388e3c');
      ctx.fillStyle = lg;
      ctx.globalAlpha = 0.92 * sc;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(L.side * 11 * sc, 5 * sc, L.side * 20 * sc, 12 * sc);
      ctx.strokeStyle = 'rgba(40, 100, 50, 0.55)';
      ctx.lineWidth = 1.3;
      ctx.stroke();

      for (let v = 1; v <= 3; v++) {
        const t = v / 4;
        ctx.beginPath();
        ctx.moveTo(L.side * 5 * sc * t, 2 * sc * t);
        ctx.quadraticCurveTo(L.side * (8 + v * 3) * sc * t, (3 + v) * sc * t, L.side * (12 + v * 2) * sc * t, (6 + v * 1.5) * sc * t);
        ctx.strokeStyle = 'rgba(50, 110, 55, 0.35)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    });
  }
  ctx.restore();

  const tipX = x + Math.sin(f.ang + sway * 0.18) * h;
  const tipY = y - Math.cos(f.ang + sway * 0.18) * h;
  return { tipX, tipY };
}

/* bud */
function drawBud(f, tipX, tipY, budP) {
  if (budP <= 0) return;
  const s = ease(budP);
  ctx.save();
  ctx.translate(tipX, tipY);
  ctx.rotate(f.ang);
  ctx.scale(s, s);

  ctx.beginPath();
  ctx.ellipse(0, -12, 11, 16, 0, 0, Math.PI * 2);
  const bg = ctx.createLinearGradient(0, 0, 0, -28);
  bg.addColorStop(0, f.preset.bud);
  bg.addColorStop(0.55, f.preset.petalMid);
  bg.addColorStop(1, f.preset.petalDeep);
  ctx.fillStyle = bg;
  ctx.shadowColor = f.preset.glow;
  ctx.shadowBlur = 14;
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.ellipse(-3, -16, 4, 7, -0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fill();

  ctx.fillStyle = '#558b2f';
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  ctx.ellipse(-9, -4, 5.5, 9, -0.5, 0, Math.PI * 2);
  ctx.ellipse(9, -4, 5.5, 9, 0.5, 0, Math.PI * 2);
  ctx.ellipse(0, 2, 7, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* normal bloom */
function drawBloom(f, tipX, tipY, openP, time) {
  if (openP <= 0) return;
  const s = 0.1 + easeBack(openP) * 0.9;
  const pr = f.preset;
  const breathe = 1 + Math.sin(time * 1.6 + f.phase) * 0.03;

  ctx.save();
  ctx.translate(tipX, tipY);
  ctx.rotate(f.ang + Math.sin(time * 0.65 + f.phase) * 0.05);
  ctx.scale(s * breathe, s * breathe);

  ctx.beginPath();
  ctx.arc(0, 0, 52, 0, Math.PI * 2);
  const gl = ctx.createRadialGradient(0, 0, 6, 0, 0, 52);
  gl.addColorStop(0, pr.glow);
  gl.addColorStop(1, 'transparent');
  ctx.fillStyle = gl;
  ctx.fill();

  const total = f.petals;
  for (let i = 0; i < total; i++) {
    const a = (i / total) * Math.PI * 2 - Math.PI / 2 + 0.15;
    ctx.save();
    ctx.rotate(a);
    ctx.beginPath();
    if (f.isTulip) {
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(16, -16, 14, -38, 0, -44);
      ctx.bezierCurveTo(-14, -38, -16, -16, 0, 0);
    } else if (f.isSun) {
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(8, -8, 7, -25, 0, -30);
      ctx.bezierCurveTo(-7, -25, -8, -8, 0, 0);
    } else {
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(20, -12, 18, -34, 0, -40);
      ctx.bezierCurveTo(-18, -34, -20, -12, 0, 0);
    }
    const pg = ctx.createLinearGradient(0, 0, 0, -42);
    pg.addColorStop(0, pr.petalDeep);
    pg.addColorStop(0.5, pr.petalMid);
    pg.addColorStop(1, pr.petalLight);
    ctx.fillStyle = pg;
    ctx.globalAlpha = 0.85;
    ctx.shadowColor = pr.glow;
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  for (let i = 0; i < total; i++) {
    const a = (i / total) * Math.PI * 2 - Math.PI / 2;
    ctx.save();
    ctx.rotate(a);
    ctx.beginPath();
    if (f.isTulip) {
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(14, -14, 12, -34, 0, -40);
      ctx.bezierCurveTo(-12, -34, -14, -14, 0, 0);
    } else if (f.isSun) {
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(7, -7, 6, -23, 0, -28);
      ctx.bezierCurveTo(-6, -23, -7, -7, 0, 0);
    } else {
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(17, -10, 15, -32, 0, -37);
      ctx.bezierCurveTo(-15, -32, -17, -10, 0, 0);
    }
    const pg = ctx.createLinearGradient(0, 0, 0, -38);
    pg.addColorStop(0, pr.petalMid);
    pg.addColorStop(0.45, pr.petalLight);
    pg.addColorStop(1, '#fffaf5');
    ctx.fillStyle = pg;
    ctx.shadowColor = 'rgba(255,255,255,0.3)';
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(0, -3);
    ctx.quadraticCurveTo(2, -18, 0, -33);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.1;
    ctx.stroke();
    ctx.restore();
  }

  if (pr.core) {
    const r = f.isSun ? 14 : 10;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    if (f.isSun) {
      const cg = ctx.createRadialGradient(0, 0, 2, 0, 0, r);
      cg.addColorStop(0, '#5d4037');
      cg.addColorStop(0.7, '#3e2723');
      cg.addColorStop(1, '#2c1a12');
      ctx.fillStyle = cg;
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.fillStyle = 'rgba(40, 25, 15, 0.7)';
      for (let k = 0; k < 18; k++) {
        const aa = (k / 18) * Math.PI * 2 + time * 0.1;
        const rr = 4 + (k % 3) * 2.2;
        ctx.beginPath();
        ctx.ellipse(Math.cos(aa) * rr * 0.7, Math.sin(aa) * rr * 0.7, 1.6, 2.2, aa, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      const cg = ctx.createRadialGradient(-3, -3, 1, 0, 0, r);
      cg.addColorStop(0, '#fffde7');
      cg.addColorStop(0.5, pr.core);
      cg.addColorStop(1, '#ffb300');
      ctx.fillStyle = cg;
      ctx.shadowColor = 'rgba(255,200,50,0.7)';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 220, 100, 0.7)';
      ctx.lineWidth = 1.1;
      for (let k = 0; k < 10; k++) {
        const aa = (k / 10) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(aa) * 3, Math.sin(aa) * 3);
        ctx.lineTo(Math.cos(aa) * 7.5, Math.sin(aa) * 7.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(Math.cos(aa) * 7.5, Math.sin(aa) * 7.5, 1.3, 0, Math.PI * 2);
        ctx.fillStyle = '#fff59d';
        ctx.fill();
      }
    }
  }
  ctx.restore();
}

/* ========== EXTRA REALISTIC ROSE ========== */
function drawRealisticRose(f, tipX, tipY, openP, time) {
  if (openP <= 0) return;
  const s = 0.12 + easeBack(openP) * 0.88;
  const pr = f.preset;
  const breathe = 1 + Math.sin(time * 1.5 + f.phase) * 0.028;

  ctx.save();
  ctx.translate(tipX, tipY);
  ctx.rotate(f.ang + Math.sin(time * 0.6 + f.phase) * 0.04);
  ctx.scale(s * breathe, s * breathe);

  // soft glow
  ctx.beginPath();
  ctx.arc(0, 0, 58, 0, Math.PI * 2);
  const gl = ctx.createRadialGradient(0, 0, 8, 0, 0, 58);
  gl.addColorStop(0, pr.glow);
  gl.addColorStop(1, 'transparent');
  ctx.fillStyle = gl;
  ctx.fill();

  // Rose has many overlapping spiral petals
  const layers = [
    { count: 5,  radius: 38, width: 22, alpha: 0.75, offset: 0.0  },
    { count: 7,  radius: 32, width: 19, alpha: 0.85, offset: 0.3  },
    { count: 8,  radius: 25, width: 16, alpha: 0.92, offset: 0.55 },
    { count: 6,  radius: 18, width: 13, alpha: 0.95, offset: 0.8  },
    { count: 5,  radius: 12, width: 10, alpha: 1.0,  offset: 1.1  }
  ];

  layers.forEach((layer, li) => {
    for (let i = 0; i < layer.count; i++) {
      const a = (i / layer.count) * Math.PI * 2 - Math.PI / 2 + layer.offset + li * 0.15;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      // classic rose petal shape (rounded + pointed tip)
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(layer.width * 0.7, -layer.radius * 0.25,
                        layer.width, -layer.radius * 0.7,
                        0, -layer.radius);
      ctx.bezierCurveTo(-layer.width, -layer.radius * 0.7,
                        -layer.width * 0.7, -layer.radius * 0.25,
                        0, 0);

      const pg = ctx.createLinearGradient(0, 0, 0, -layer.radius);
      if (li < 2) {
        pg.addColorStop(0, pr.petalDeep);
        pg.addColorStop(0.55, pr.petalMid);
        pg.addColorStop(1, pr.petalLight);
      } else {
        pg.addColorStop(0, pr.petalMid);
        pg.addColorStop(0.5, pr.petalLight);
        pg.addColorStop(1, '#fff5f5');
      }
      ctx.fillStyle = pg;
      ctx.globalAlpha = layer.alpha;
      ctx.shadowColor = pr.glow;
      ctx.shadowBlur = li === 0 ? 12 : 5;
      ctx.fill();
      ctx.shadowBlur = 0;

      // subtle inner fold
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.quadraticCurveTo(layer.width * 0.15, -layer.radius * 0.5, 0, -layer.radius * 0.9);
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1.0;
      ctx.stroke();
      ctx.restore();
    }
  });

  // center
  ctx.beginPath();
  ctx.arc(0, 0, 9, 0, Math.PI * 2);
  const cg = ctx.createRadialGradient(-2, -2, 1, 0, 0, 9);
  cg.addColorStop(0, '#fffde7');
  cg.addColorStop(0.5, pr.core || '#ffd54f');
  cg.addColorStop(1, '#ffb300');
  ctx.fillStyle = cg;
  ctx.shadowColor = 'rgba(255,200,50,0.7)';
  ctx.shadowBlur = 10;
  ctx.fill();

  // tiny stamens
  ctx.strokeStyle = 'rgba(255, 220, 100, 0.75)';
  ctx.lineWidth = 1.15;
  for (let k = 0; k < 12; k++) {
    const aa = (k / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(aa) * 3.5, Math.sin(aa) * 3.5);
    ctx.lineTo(Math.cos(aa) * 8, Math.sin(aa) * 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(Math.cos(aa) * 8, Math.sin(aa) * 8, 1.4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff59d';
    ctx.fill();
  }

  ctx.restore();
}

/* main animation */
let startT = 0;
function frame(now) {
  if (!startT) startT = now;
  const elapsed = (now - startT) / 1000;
  const time = now / 1000;

  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(W / 2, H * 0.3, 0, W / 2, H * 0.4, Math.max(W, H) * 0.9);
  bg.addColorStop(0, '#1f0b1a');
  bg.addColorStop(0.5, '#0c050e');
  bg.addColorStop(1, '#030208');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  particles.forEach(p => { p.update(); p.draw(); });

  const ground = ctx.createLinearGradient(0, H * 0.82, 0, H);
  ground.addColorStop(0, 'transparent');
  ground.addColorStop(1, 'rgba(25, 55, 35, 0.3)');
  ctx.fillStyle = ground;
  ctx.fillRect(0, H * 0.78, W, H * 0.22);

  // normal flowers
  flowers.forEach(f => {
    const local = elapsed - f.delay;
    if (local < 0) return;

    const rootP  = ease(Math.min(1, local / 0.5));
    const stemP  = ease(Math.max(0, Math.min(1, (local - STAGE.stem) / 1.75)));
    const leafP  = ease(Math.max(0, Math.min(1, (local - STAGE.leaf) / 0.95)));
    const budP   = ease(Math.max(0, Math.min(1, (local - STAGE.bud) / 0.8)));
    const openP  = ease(Math.max(0, Math.min(1, (local - STAGE.open) / 1.2)));
    const budFade = openP > 0 ? Math.max(0, 1 - openP * 2.0) : 1;

    drawRoot(f, rootP);
    const tip = drawStemAndLeaves(f, stemP, leafP, time);

    if (openP > 0.03) {
      drawBloom(f, tip.tipX, tip.tipY, openP, time);
    } else if (budP > 0) {
      drawBud(f, tip.tipX, tip.tipY, budP * budFade);
    }
  });

  // show rose message after main garden is mostly done
  if (!mainDone && elapsed > 22) {
    mainDone = true;
    roseMsg.classList.add('show');
  }

  // realistic roses
  if (rosesStarted) {
    const roseElapsed = (now - roseStartT) / 1000;
    roses.forEach(f => {
      const local = roseElapsed - f.delay;
      if (local < 0) return;

      const rootP  = ease(Math.min(1, local / 0.5));
      const stemP  = ease(Math.max(0, Math.min(1, (local - STAGE.stem) / 1.8)));
      const leafP  = ease(Math.max(0, Math.min(1, (local - STAGE.leaf) / 1.0)));
      const budP   = ease(Math.max(0, Math.min(1, (local - STAGE.bud) / 0.85)));
      const openP  = ease(Math.max(0, Math.min(1, (local - STAGE.open) / 1.3)));
      const budFade = openP > 0 ? Math.max(0, 1 - openP * 2.0) : 1;

      drawRoot(f, rootP);
      const tip = drawStemAndLeaves(f, stemP, leafP, time);

      if (openP > 0.03) {
        drawRealisticRose(f, tip.tipX, tip.tipY, openP, time);
      } else if (budP > 0) {
        drawBud(f, tip.tipX, tip.tipY, budP * budFade);
      }
    });
  }

  requestAnimationFrame(frame);
}

seeBtn.addEventListener('click', () => {
  intro.classList.add('hide');
  startT = 0;
  started = true;
  music.play().catch(() => {});
  requestAnimationFrame(frame);

  for (let i = 0; i < 14; i++) {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    sp.textContent = ['✨', '🌸', '💕', '🌷', '💖', '🌺'][i % 6];
    sp.style.left = Math.random() * 100 + 'vw';
    sp.style.animationDelay = (Math.random() * 6) + 's';
    sp.style.animationDuration = (5.5 + Math.random() * 4) + 's';
    document.body.appendChild(sp);
  }
});

/* click on rose message → grow real roses */
roseMsg.addEventListener('click', () => {
  if (rosesStarted) return;
  rosesStarted = true;
  roseStartT = performance.now();
  roseMsg.classList.remove('show');

  // create the special roses
  ROSE_LAYOUT.forEach(l => roses.push(createFlower(l, true)));
});
</script>
