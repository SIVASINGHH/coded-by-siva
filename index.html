<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romantic Tic Tac Toe - SIVASINGH</title>
  <!-- PeerJS for WebRTC Online Multiplayer & Audio -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #ff2a6d;
      --secondary: #ff758c;
      --bg-dark: #0f051d;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 117, 140, 0.3);
      --text: #ffffff;
      --x-color: #ff2a6d;
      --o-color: #00f5d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #2c0b30, var(--bg-dark));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Hearts Background Animation */
    .hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart-particle {
      position: absolute;
      color: rgba(255, 42, 109, 0.3);
      animation: floatUp 8s infinite linear;
      font-size: 1.2rem;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.8) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    /* Overlay Screens */
    .overlay-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    /* Intro Overlay */
    #intro-screen h1 {
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(45deg, #ff2a6d, #ff758c, #00f5d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glowPulse 2s infinite alternate, scaleUp 1.5s ease-out;
    }

    @keyframes glowPulse {
      0% { filter: drop-shadow(0 0 5px rgba(255, 42, 109, 0.6)); }
      100% { filter: drop-shadow(0 0 25px rgba(255, 42, 109, 0.9)); }
    }

    @keyframes scaleUp {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Welcome Overlay */
    #welcome-screen {
      background: rgba(15, 5, 29, 0.95);
      z-index: 90;
    }

    .card-modal {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      padding: 2rem 3rem;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      max-width: 90%;
    }

    .card-modal h2 {
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      color: #ff758c;
    }

    .btn-main {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border: none;
      color: white;
      padding: 12px 30px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(255, 42, 109, 0.4);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-main:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 42, 109, 0.6);
    }

    /* Main Game Layout */
    .app-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    /* Top Control Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      padding: 10px 15px;
      border-radius: 15px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .control-btn.active {
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    /* Online Connection Panel */
    .connection-panel {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      padding: 15px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.9rem;
    }

    .peer-id-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      padding: 8px 12px;
      border-radius: 8px;
      color: white;
      outline: none;
    }

    .status-text {
      font-size: 0.85rem;
      text-align: center;
      color: #00f5d4;
    }

    /* Game Info & Board */
    .game-status {
      font-size: 1.3rem;
      font-weight: 600;
      text-shadow: 0 0 10px var(--primary);
      min-height: 32px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      aspect-ratio: 1;
    }

    .cell {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
    }

    .cell:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    .cell.x {
      color: var(--x-color);
      text-shadow: 0 0 15px var(--x-color);
    }

    .cell.o {
      color: var(--o-color);
      text-shadow: 0 0 15px var(--o-color);
    }

    /* Hidden Audio Elements */
    audio { display: none; }
  </style>
</head>
<body>

  <!-- Hearts Floating Background -->
  <div class="hearts-bg" id="heartsContainer"></div>

  <!-- Intro Screen -->
  <div class="overlay-screen" id="intro-screen">
    <h1>Modded by SIVASINGH</h1>
  </div>

  <!-- Welcome Screen -->
  <div class="overlay-screen" id="welcome-screen" style="display: none; opacity: 0;">
    <div class="card-modal">
      <h2>Devu lets play 🤭🤭</h2>
      <button class="btn-main" onclick="startGame()">Start Game ❤️</button>
    </div>
  </div>

  <!-- Main Game App -->
  <div class="app-container">
    
    <!-- Top Audio & Control Bar -->
    <div class="controls-bar">
      <!-- Voice Mic Toggle -->
      <button class="control-btn" id="micBtn" onclick="toggleMic()" title="Toggle Mic">
        <i class="fa-solid fa-microphone-slash"></i>
      </button>

      <!-- Music Player Controls -->
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="control-btn" id="musicBtn" onclick="toggleMusic()" title="Play/Pause Music">
          <i class="fa-solid fa-music"></i>
        </button>
        <button class="control-btn" onclick="switchSong()" title="Switch Song">
          <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>

      <!-- Reset Game -->
      <button class="control-btn" onclick="resetGame()" title="Reset Board">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>

    <!-- Connection Panel (Multiplayer) -->
    <div class="connection-panel">
      <div class="peer-id-box">
        <span>Your Room Code: <strong id="my-id">Generating...</strong></span>
        <button class="control-btn" style="width: 30px; height: 30px;" onclick="copyID()" title="Copy Code">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
      <div class="input-group">
        <input type="text" id="friend-id" placeholder="Enter Bestie's Code">
        <button class="btn-main" style="padding: 8px 15px; margin: 0; font-size: 0.9rem;" onclick="connectToFriend()">Connect</button>
      </div>
      <div class="status-text" id="status-text">Playing Offline / Waiting for Connection</div>
    </div>

    <!-- Status Text -->
    <div class="game-status" id="gameStatus">Your Turn (X)</div>

    <!-- Tic Tac Toe Grid -->
    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

  </div>

  <!-- Audio Elements -->
  <audio id="bgMusic" loop>
    <source id="musicSource" src="song1.mp3" type="audio/mpeg">
  </audio>
  <audio id="remoteAudio" autoplay></audio>

  <script>
    /* --- Floating Hearts Background Generator --- */
    const heartsContainer = document.getElementById('heartsContainer');
    const heartIcons = ['❤️', '💖', '💕', '💗', '✨'];
    
    for (let i = 0; i < 25; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.animationDelay = `${Math.random() * 8}s`;
      heart.style.fontSize = `${12 + Math.random() * 20}px`;
      heartsContainer.appendChild(heart);
    }

    /* --- Flow Sequence (Intro -> Welcome -> Main Game) --- */
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const intro = document.getElementById('intro-screen');
        const welcome = document.getElementById('welcome-screen');
        
        intro.style.opacity = '0';
        setTimeout(() => {
          intro.style.display = 'none';
          welcome.style.display = 'flex';
          setTimeout(() => welcome.style.opacity = '1', 50);
        }, 800);
      }, 2500);
    });

    function startGame() {
      const welcome = document.getElementById('welcome-screen');
      welcome.style.opacity = '0';
      setTimeout(() => {
        welcome.style.display = 'none';
        initPeer();
      }, 800);
    }

    /* --- Music Controls --- */
    const bgMusic = document.getElementById('bgMusic');
    const musicSource = document.getElementById('musicSource');
    const musicBtn = document.getElementById('musicBtn');
    let isPlaying = false;
    let currentSong = 1;

    function toggleMusic() {
      if (isPlaying) {
        bgMusic.pause();
        musicBtn.classList.remove('active');
      } else {
        bgMusic.play().catch(e => console.log("Audio play blocked by browser."));
        musicBtn.classList.add('active');
      }
      isPlaying = !isPlaying;
    }

    function switchSong() {
      currentSong = currentSong === 1 ? 2 : 1;
      musicSource.src = `song${currentSong}.mp3`;
      bgMusic.load();
      if (isPlaying) bgMusic.play();
    }

    /* --- Game Logic --- */
    let boardState = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X"; // Default host is X
    let mySymbol = "X";
    let isGameActive = true;
    let isMultiplayer = false;

    const gameStatus = document.getElementById('gameStatus');
    const cells = document.querySelectorAll('.cell');
    const winningCombinations = [
      [0,1,2], [3,4,5], [6,7,8], // Rows
      [0,3,6], [1,4,7], [2,5,8], // Columns
      [0,4,8], [2,4,6]          // Diagonals
    ];

    cells.forEach(cell => {
      cell.addEventListener('click', () => handleCellClick(cell));
    });

    function handleCellClick(cell) {
      const index = cell.getAttribute('data-index');

      if (boardState[index] !== "" || !isGameActive) return;
      if (isMultiplayer && currentPlayer !== mySymbol) return;

      makeMove(index, currentPlayer);

      if (isMultiplayer && dataConnection) {
        dataConnection.send({ type: 'MOVE', index: index, symbol: mySymbol });
      }
    }

    function makeMove(index, symbol) {
      boardState[index] = symbol;
      const cell = cells[index];
      cell.innerText = symbol;
      cell.classList.add(symbol.toLowerCase());

      if (checkWin(symbol)) {
        gameStatus.innerText = `${symbol === 'X' ? '❤️ X' : '💖 O'} Wins!`;
        isGameActive = false;
        return;
      }

      if (boardState.every(cell => cell !== "")) {
        gameStatus.innerText = "It's a Draw! 💖";
        isGameActive = false;
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatusDisplay();
    }

    function checkWin(symbol) {
      return winningCombinations.some(combination => {
        return combination.every(index => boardState[index] === symbol);
      });
    }

    function updateStatusDisplay() {
      if (isMultiplayer) {
        gameStatus.innerText = currentPlayer === mySymbol ? "Your Turn!" : "Bestie's Turn...";
      } else {
        gameStatus.innerText = `Turn: ${currentPlayer}`;
      }
    }

    function resetGame(sendRemote = true) {
      boardState = ["", "", "", "", "", "", "", "", ""];
      isGameActive = true;
      currentPlayer = "X";
      cells.forEach(cell => {
        cell.innerText = "";
        cell.classList.remove('x', 'o');
      });
      updateStatusDisplay();

      if (isMultiplayer && sendRemote && dataConnection) {
        dataConnection.send({ type: 'RESET' });
      }
    }

    /* --- Online Multiplayer & Voice Chat (WebRTC via PeerJS) --- */
    let peer = null;
    let dataConnection = null;
    let localStream = null;
    let micActive = false;

    function initPeer() {
      peer = new Peer();

      peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
      });

      peer.on('connection', (conn) => {
        dataConnection = conn;
        setupDataListener();
        isMultiplayer = true;
        mySymbol = "O"; // Joiner is O
        document.getElementById('status-text').innerText = "Connected with Bestie! 💕";
        resetGame(false);
      });

      peer.on('call', (call) => {
        navigator.mediaDevices.getUserMedia({ 
          audio: { 
            echoCancellation: true, 
            noiseSuppression: true, 
            autoGainControl: true 
          } 
        }).then(stream => {
          localStream = stream;
          call.answer(stream);
          call.on('stream', remoteStream => {
            document.getElementById('remoteAudio').srcObject = remoteStream;
          });
        });
      });
    }

    function connectToFriend() {
      const friendId = document.getElementById('friend-id').value.trim();
      if (!friendId) return alert('Please enter Room Code');

      dataConnection = peer.connect(friendId);
      setupDataListener();
      isMultiplayer = true;
      mySymbol = "X"; // Host is X
      document.getElementById('status-text').innerText = "Connected with Bestie! 💕";
      
      // Start Voice Call
      startVoiceCall(friendId);
      resetGame(false);
    }

    function setupDataListener() {
      dataConnection.on('data', (data) => {
        if (data.type === 'MOVE') {
          makeMove(data.index, data.symbol);
        } else if (data.type === 'RESET') {
          resetGame(false);
        }
      });
    }

    function copyID() {
      const myId = document.getElementById('my-id').innerText;
      if (myId && myId !== "Generating...") {
        navigator.clipboard.writeText(myId);
        alert("Room Code copied to clipboard!");
      }
    }

    /* --- High Quality Voice Chat with Noise Reduction --- */
    async function toggleMic() {
      const micBtn = document.getElementById('micBtn');

      if (!micActive) {
        try {
          // Microphone settings optimized for Zero Noise / High Clarity
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
          
          micActive = true;
          micBtn.classList.add('active');
          micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';

          if (dataConnection && peer) {
            startVoiceCall(dataConnection.peer);
          }
        } catch (err) {
          alert('Microphone access denied or unavailable.');
        }
      } else {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }
        micActive = false;
        micBtn.classList.remove('active');
        micBtn.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
      }
    }

    function startVoiceCall(remotePeerId) {
      if (!localStream) return;
      const call = peer.call(remotePeerId, localStream);
      call.on('stream', remoteStream => {
        document.getElementById('remoteAudio').srcObject = remoteStream;
      });
    }
  </script>
</body>
</html>
