<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 🌸</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020105;
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  .intro-card {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(4, 2, 8, 0.92);
    backdrop-filter: blur(10px);
    color: #fff;
    text-align: center;
    padding: 24px;
    transition: opacity 1.2s ease, visibility 1.2s;
  }

  .intro-card.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .intro-card h1 {
    font-size: 2.5rem;
    color: #ff8fab;
    margin-bottom: 16px;
    text-shadow: 0 0 20px rgba(255, 143, 171, 0.6);
    font-weight: 600;
  }

  .intro-card p {
    font-size: 1.15rem;
    color: #ffe5ec;
    max-width: 520px;
    line-height: 1.7;
    margin-bottom: 32px;
    opacity: 0.95;
  }

  .btn-flowers {
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: #ffffff;
    border: none;
    padding: 16px 36px;
    font-size: 1.15rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    letter-spacing: 0.5px;
  }

  .btn-flowers:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(255, 77, 109, 0.9);
  }

  .garden-title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    color: #ffb3c6;
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 2.5s ease;
    text-shadow: 0 0 15px rgba(255, 179, 198, 0.6);
    pointer-events: none;
    text-align: center;
    width: 90%;
  }
  
  .garden-title.show {
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="intro-card" id="intro">
    <h1>Hey cutiee! ✨</h1>
    <p>I just met you and talked to you, so I just told you NTMY... <br><br><strong>But wait, where are the flowers? 🌷</strong></p>
    <button class="btn-flowers" id="startBtn">See Flowers 🌸</button>
  </div>

  <div class="garden-title" id="gardenTitle">Here is your romantic garden... 💖</div>

  <canvas id="c"></canvas>

  <audio id="music" loop>
    <source src="tere-liye.mp3" type="audio/mpeg">
  </audio>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const music = document.getElementById('music');
const intro = document.getElementById('intro');
const startBtn = document.getElementById('startBtn');
const gardenTitle = document.getElementById('gardenTitle');

let W, H;
const particles = [];
const flowers = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Ambient Magic Dust & Flying Petals
class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 20;
    this.r = 1.0 + Math.random() * 2.5;
    this.speed = 0.2 + Math.random() * 0.4;
    this.a = 0.15 + Math.random() * 0.4;
    this.col = Math.random() > 0.5 ? '#ffb3c6' : '#ffe5ec';
  }
  update(time) {
    this.y -= this.speed;
    this.x += Math.sin(time * 0.001 + this.y * 0.005) * 0.5;
    if (this.y < -20) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.col;
    ctx.globalAlpha = this.a;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}
for (let i = 0; i < 80; i++) particles.push(new Particle());

const PRESETS = [
  { petalBase: '#b7094c', petalMid: '#ff0054', petalTip: '#ff8fab', core: '#ffb703', glow: 'rgba(255,0,84,0.45)' },
  { petalBase: '#5c0099', petalMid: '#8900f2', petalTip: '#e0aaff', core: '#ffe600', glow: 'rgba(137,0,242,0.45)' },
  { petalBase: '#d90429', petalMid: '#ef233c', petalTip: '#ffb3c6', core: '#ffffff', glow: 'rgba(239,35,60,0.45)' },
  { petalBase: '#f77f00', petalMid: '#fcbf49', petalTip: '#fff3b0', core: '#3d0007', glow: 'rgba(252,191,73,0.45)' },
  { petalBase: '#0077b6', petalMid: '#00b4d8', petalTip: '#90e0ef', core: '#ffea00', glow: 'rgba(0,180,216,0.45)' }
];

const STAGE = { root: 0.0, stem: 0.35, leaf: 1.4, bud: 2.2, open: 3.1 };

function createFlower(cfg) {
  return {
    cx: cfg.x, base: 0.96, maxH: cfg.h,
    ang: cfg.ang * Math.PI / 180, delay: cfg.delay,
    preset: PRESETS[cfg.p], petals: cfg.petals || 7,
    phaseOffset: Math.random() * Math.PI * 2
  };
}

const LAYOUT = [
  { x: 0.10, h: 0.48, delay: 0.0,  ang: -18, p: 0, petals: 7 },
  { x: 0.22, h: 0.62, delay: 1.2,  ang: -10, p: 1, petals: 8 },
  { x: 0.34, h: 0.52, delay: 2.4,  ang: -4,  p: 2, petals: 9 },
  { x: 0.46, h: 0.66, delay: 3.6,  ang: 0,   p: 0, petals: 8 },
  { x: 0.58, h: 0.58, delay: 4.8,  ang: 4,   p: 3, petals: 10 },
  { x: 0.70, h: 0.68, delay: 6.0,  ang: 10,  p: 1, petals: 8 },
  { x: 0.82, h: 0.54, delay: 7.2,  ang: 16,  p: 4, petals: 7 },
  { x: 0.92, h: 0.46, delay: 8.4,  ang: 22,  p: 2, petals: 9 },
  { x: 0.28, h: 0.38, delay: 9.6,  ang: -8,  p: 3, petals: 6 },
  { x: 0.64, h: 0.40, delay: 10.8, ang: 6,   p: 0, petals: 8 }
];

LAYOUT.forEach(l => flowers.push(createFlower(l)));

function ease(t) { return t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3); }
function easeBack(t) { const c = 1.6; return t <= 0 ? 0 : t >= 1 ? 1 : 1 + c * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

function drawRoot(f, p) {
  if (p <= 0) return;
  const x = f.cx * W, y = f.base * H;
  ctx.save();
  ctx.translate(x, y);
  const s = ease(p) * 18;
  ctx.beginPath();
  ctx.ellipse(0, 4, s * 1.6, s * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(25, 12, 8, 0.85)';
  ctx.fill();
  ctx.restore();
}

function drawStemAndLeaves(f, stemP, leafP, wind) {
  const h = f.maxH * H * ease(stemP);
  if (h < 2) return { tipX: f.cx * W, tipY: f.base * H };
  const x = f.cx * W, y = f.base * H;

  ctx.save();
  ctx.translate(x, y);

  const currentAng = f.ang + wind;
  const ctrlX = Math.sin(currentAng) * h * 0.55;
  const tipX = Math.sin(currentAng) * h;
  const tipY = -h;

  const g = ctx.createLinearGradient(0, 0, tipX, tipY);
  g.addColorStop(0, '#133c1a');
  g.addColorStop(0.5, '#2d6a4f');
  g.addColorStop(1, '#52b788');

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(ctrlX, -h * 0.5, tipX, tipY);
  ctx.strokeStyle = g;
  ctx.lineWidth = 4.8;
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(82, 183, 136, 0.35)';
  ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.shadowBlur = 0;

  if (leafP > 0) {
    const leaves = [
      { pos: 0.55, side: -1, size: 1.1 },
      { pos: 0.35, side:  1, size: 1.0 }
    ];
    leaves.forEach((L, i) => {
      const lp = Math.max(0, Math.min(1, (leafP - i * 0.2) / 0.4));
      if (lp <= 0) return;
      const lx = ctrlX * L.pos;
      const ly = -h * L.pos;
      const sc = ease(lp) * L.size;

      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(L.side * 0.7 * sc + wind * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(L.side * 14 * sc, -6 * sc, L.side * 26 * sc, 3 * sc, L.side * 22 * sc, 12 * sc);
      ctx.bezierCurveTo(L.side * 14 * sc, 10 * sc, L.side * 6 * sc, 5 * sc, 0, 0);
      
      const lg = ctx.createLinearGradient(0, 0, L.side * 22 * sc, 12 * sc);
      lg.addColorStop(0, '#1b4332');
      lg.addColorStop(1, '#74c69d');
      ctx.fillStyle = lg;
      ctx.fill();
      ctx.restore();
    });
  }

  ctx.restore();
  return { tipX: x + tipX, tipY: y + tipY, angle: currentAng };
}

function drawBud(f, tipX, tipY, budP, ang) {
  if (budP <= 0) return;
  const s = ease(budP);
  ctx.save();
  ctx.translate(tipX, tipY);
  ctx.rotate(ang);
  ctx.scale(s, s);

  ctx.beginPath();
  ctx.ellipse(0, -12, 9, 15, 0, 0, Math.PI * 2);
  const bg = ctx.createLinearGradient(0, 0, 0, -27);
  bg.addColorStop(0, f.preset.petalBase);
  bg.addColorStop(1, f.preset.petalTip);
  ctx.fillStyle = bg;
  ctx.shadowColor = f.preset.glow;
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.restore();
}

function drawRealisticPetal(ctx, len, width, pr) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(width * 0.9, -len * 0.25, width * 1.1, -len * 0.75, 0, -len);
  ctx.bezierCurveTo(-width * 1.1, -len * 0.75, -width * 0.9, -len * 0.25, 0, 0);

  const pg = ctx.createLinearGradient(0, 0, 0, -len);
  pg.addColorStop(0, pr.petalBase);
  pg.addColorStop(0.5, pr.petalMid);
  pg.addColorStop(1, pr.petalTip);
  ctx.fillStyle = pg;
  ctx.shadowColor = pr.glow;
  ctx.shadowBlur = 10;
  ctx.fill();
  
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -len * 0.8);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawBloom(f, tipX, tipY, openP, ang) {
  if (openP <= 0) return;
  const scale = 0.1 + easeBack(openP) * 0.9;
  const pr = f.preset;

  ctx.save();
  ctx.translate(tipX, tipY);
  ctx.rotate(ang);
  ctx.scale(scale, scale);

  ctx.beginPath();
  ctx.arc(0, 0, 58, 0, Math.PI * 2);
  const gl = ctx.createRadialGradient(0, 0, 5, 0, 0, 58);
  gl.addColorStop(0, pr.glow);
  gl.addColorStop(1, 'transparent');
  ctx.fillStyle = gl;
  ctx.fill();

  const numPetals = f.petals;
  // Outer Layer
  for (let i = 0; i < numPetals; i++) {
    const angle = (i / numPetals) * Math.PI * 2;
    ctx.save();
    ctx.rotate(angle);
    drawRealisticPetal(ctx, 45, 20, pr);
    ctx.restore();
  }

  // Inner Layer
  for (let i = 0; i < numPetals; i++) {
    const angle = (i / numPetals) * Math.PI * 2 + (Math.PI / numPetals);
    ctx.save();
    ctx.rotate(angle);
    ctx.scale(0.75, 0.75);
    drawRealisticPetal(ctx, 42, 18, pr);
    ctx.restore();
  }

  // Real Stamen / Center
  if (pr.core) {
    const r = 10;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = pr.core;
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 8;
    ctx.fill();

    for (let j = 0; j < 10; j++) {
      const dotAng = (j / 10) * Math.PI * 2;
      const dx = Math.cos(dotAng) * (r + 4);
      const dy = Math.sin(dotAng) * (r + 4);
      ctx.beginPath();
      ctx.arc(dx, dy, 1.8, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }
  }

  ctx.restore();
}

let startT = 0;
function frame(now) {
  if (!startT) startT = now;
  const elapsed = (now - startT) / 1000;

  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(W / 2, H * 0.4, 0, W / 2, H * 0.5, H * 0.85);
  bg.addColorStop(0, '#1c0924');
  bg.addColorStop(1, '#020105');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  particles.forEach(p => { p.update(now); p.draw(); });

  flowers.forEach(f => {
    const local = elapsed - f.delay;
    if (local < 0) return;

    // Gentle wind sway algorithm
    const wind = Math.sin(now * 0.0015 + f.phaseOffset) * 0.08 + Math.cos(now * 0.0008 + f.phaseOffset) * 0.04;

    const rootP = ease(Math.min(1, local / 0.5));
    const stemP = ease(Math.max(0, Math.min(1, (local - STAGE.stem) / 1.8)));
    const leafP = ease(Math.max(0, Math.min(1, (local - STAGE.leaf) / 0.9)));
    const budP  = ease(Math.max(0, Math.min(1, (local - STAGE.bud) / 0.8)));
    const openP = ease(Math.max(0, Math.min(1, (local - STAGE.open) / 1.2)));

    drawRoot(f, rootP);
    const tip = drawStemAndLeaves(f, stemP, leafP, wind);

    if (openP > 0.02) {
      drawBloom(f, tip.tipX, tip.tipY, openP, tip.angle);
    } else if (budP > 0) {
      drawBud(f, tip.tipX, tip.tipY, budP, tip.angle);
    }
  });

  requestAnimationFrame(frame);
}

startBtn.addEventListener('click', () => {
  intro.classList.add('hide');
  setTimeout(() => gardenTitle.classList.add('show'), 1800);
  startT = 0;
  music.play().catch(() => {});
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
