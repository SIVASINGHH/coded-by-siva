<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coded by SIVASINGH</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff2a6d;
      --secondary: #ff758c;
      --accent: #00f5d4;
      --bg-dark: #08020f;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 117, 140, 0.3);
      --text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
    body { background: var(--bg-dark); color: var(--text); min-height: 100vh; overflow: hidden; position: relative; }

    .page { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10; opacity: 0; visibility: hidden; transition: opacity 0.5s ease; }
    .page.active { opacity: 1; visibility: visible; }

    /* Intro & Lobby Styling */
    .intro-title { font-family: 'Fredoka', cursive; font-size: 2.8rem; text-align: center; text-transform: uppercase; background: linear-gradient(45deg, #ff2a6d, #ff758c, #00f5d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(255, 42, 109, 0.8)); }
    .glass-card { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(16px); padding: 2rem; border-radius: 24px; text-align: center; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8); width: 100%; max-width: 420px; }
    
    .btn-pink { background: linear-gradient(45deg, var(--primary), var(--secondary)); border: none; color: white; padding: 12px 30px; font-size: 1.1rem; font-weight: 600; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 42, 109, 0.4); transition: 0.3s; margin-top: 15px; display: inline-flex; align-items: center; gap: 10px; justify-content: center; width: 100%; }
    .btn-pink:hover { transform: translateY(-2px) scale(1.02); }

    /* HUD Overlay */
    #game-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    .hud-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
    .interactive { pointer-events: auto; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .control-btn { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--glass-border); color: var(--text); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(8px); transition: 0.3s; font-size: 1.1rem; }
    .control-btn.active { background: var(--primary); box-shadow: 0 0 15px var(--primary); }

    /* Dashboard & Gauges */
    .dashboard { position: absolute; bottom: 30px; right: 20px; background: rgba(0,0,0,0.6); padding: 15px 20px; border-radius: 20px; border: 1px solid var(--glass-border); text-align: right; backdrop-filter: blur(10px); }
    .speed-val { font-size: 2.2rem; font-weight: bold; color: var(--accent); font-family: 'Fredoka'; line-height: 1; }
    .unit { font-size: 0.8rem; opacity: 0.8; }

    /* On-Screen Mobile Controls */
    .touch-controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 12px; }
    .touch-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); color: white; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .touch-btn:active { background: var(--primary); }

    .nitro-btn { position: absolute; bottom: 20px; right: 180px; width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(45deg, #00f5d4, #00bbf9); border: none; color: black; font-weight: bold; font-size: 1rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px var(--accent); }

    /* Gifts Display Bar */
    .gifts-bar { display: flex; gap: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); border-radius: 30px; padding: 6px 15px; backdrop-filter: blur(10px); }
    .gift-btn { background: transparent; border: none; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
    .gift-btn:hover { transform: scale(1.3); }

    /* Floating Animations */
    .flying-gift { position: fixed; font-size: 3rem; z-index: 1000; pointer-events: none; transition: all 1s ease-in-out; }
    audio { display: none; }
  </style>
</head>
<body>

  <!-- PAGE 1: INTRO -->
  <div class="page active" id="page-intro">
    <h1 class="intro-title">Modded by SIVASINGH</h1>
  </div>

  <!-- PAGE 2: WELCOME -->
  <div class="page" id="page-welcome">
    <div class="glass-card">
      <h2 style="font-size: 1.8rem; color: #ff758c; margin-bottom: 10px;">Devu Ready for Race? 🏎️💨</h2>
      <p style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 20px;">Moti mere sath race karegi aaja babu 🤭!</p>
      <button class="btn-pink" onclick="goToPage('page-lobby')">Start Engine ❤️</button>
    </div>
  </div>

  <!-- PAGE 3: LOBBY -->
  <div class="page" id="page-lobby">
    <div class="glass-card" id="lobby-input-box">
      <h3 style="margin-bottom: 15px; color: var(--secondary);">Connect Race Lobby</h3>
      <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.85rem;">Your ID: <strong id="my-code" style="color: var(--accent);">Generating...</strong></span>
        <button class="control-btn interactive" style="width: 32px; height: 32px;" onclick="copyCode()"><i class="fa-solid fa-copy"></i></button>
      </div>
      <input type="text" id="friend-code" placeholder="Enter Bestie's ID" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 12px; color: white; outline: none; text-align: center; margin-bottom: 15px;">
      <button class="btn-pink" onclick="startConnection()">Connect & Race 💕</button>
      <button class="btn-pink" style="background: rgba(255,255,255,0.1); margin-top: 10px;" onclick="startSoloRace()">Practice Solo 🏎️</button>
    </div>
  </div>

  <!-- PAGE 4: MAIN 3D CANVAS -->
  <div class="page" id="page-game" style="padding: 0;">
    <div id="game-container"></div>
    
    <div class="hud-layer">
      <div class="top-bar">
        <div style="display: flex; gap: 10px;">
          <button class="control-btn interactive" id="micBtn" onclick="toggleMic()"><i class="fa-solid fa-microphone-slash"></i></button>
          <button class="control-btn interactive" id="musicBtn" onclick="toggleMusic()"><i class="fa-solid fa-music"></i></button>
          <button class="control-btn interactive" onclick="switchSong()"><i class="fa-solid fa-forward-step"></i></button>
        </div>

        <div class="gifts-bar interactive">
          <button class="gift-btn" onclick="sendGift('🌹')">🌹</button>
          <button class="gift-btn" onclick="sendGift('💋')">💋</button>
          <button class="gift-btn" onclick="sendGift('🥊')">🥊</button>
        </div>
      </div>

      <div class="dashboard">
        <div class="speed-val" id="speedometer">0</div>
        <div class="unit">KM/H</div>
      </div>

      <div class="touch-controls interactive">
        <div class="touch-btn" id="btn-left"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="touch-btn" id="btn-right"><i class="fa-solid fa-arrow-right"></i></div>
        <div class="touch-btn" id="btn-brake" style="background: rgba(255, 42, 109, 0.4);"><i class="fa-solid fa-ban"></i></div>
      </div>

      <button class="nitro-btn interactive" id="btn-nitro">NOS</button>
    </div>
  </div>

  <audio id="bgMusic" loop><source id="musicSource" src="song1.mp3" type="audio/mpeg"></audio>
  <audio id="remoteAudio" autoplay></audio>

  <script>
    /* --- Navigation --- */
    function goToPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { goToPage('page-welcome'); initPeer(); }, 2500);
    });

    /* --- Audio Synthesizer Engine Sound --- */
    let audioCtx, osc, gainNode;
    function initEngineSound() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 40;
        gainNode.gain.value = 0.04;
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
      } catch(e) {}
    }

    function updateEngineSound(speed) {
      if (osc && audioCtx) osc.frequency.setTargetAtTime(30 + speed * 1.5, audioCtx.currentTime, 0.1);
    }

    /* --- Music Controls --- */
    const bgMusic = document.getElementById('bgMusic');
    const musicSource = document.getElementById('musicSource');
    let isPlaying = false, currentSong = 1;

    function toggleMusic() {
      if (isPlaying) { bgMusic.pause(); document.getElementById('musicBtn').classList.remove('active'); }
      else { bgMusic.play().catch(()=>{}); document.getElementById('musicBtn').classList.add('active'); }
      isPlaying = !isPlaying;
    }

    function switchSong() {
      currentSong = currentSong === 1 ? 2 : 1;
      musicSource.src = `song${currentSong}.mp3`;
      bgMusic.load(); if (isPlaying) bgMusic.play();
    }

    /* --- PeerJS Multiplayer --- */
    let peer, dataConn, localStream, micActive = false;
    let remoteCarPos = { x: 2, z: 0 };

    function initPeer() {
      peer = new Peer();
      peer.on('open', id => document.getElementById('my-code').innerText = id);
      peer.on('connection', conn => {
        dataConn = conn; setupDataListener();
        goToPage('page-game'); init3DGame();
      });
      peer.on('call', call => {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          call.answer(stream);
          call.on('stream', rStream => document.getElementById('remoteAudio').srcObject = rStream);
        });
      });
    }

    function startConnection() {
      const code = document.getElementById('friend-code').value.trim();
      if (!code) return alert("Enter Bestie's ID!");
      dataConn = peer.connect(code);
      setupDataListener();
      goToPage('page-game'); init3DGame();
    }

    function startSoloRace() {
      goToPage('page-game'); init3DGame();
    }

    function setupDataListener() {
      dataConn.on('data', data => {
        if (data.type === 'POS') { remoteCarPos.x = data.x; remoteCarPos.z = data.z; }
        if (data.type === 'GIFT') triggerGiftAnimation(data.emoji);
      });
    }

    function copyCode() {
      navigator.clipboard.writeText(document.getElementById('my-code').innerText);
      alert("ID Copied!");
    }

    async function toggleMic() {
      const micBtn = document.getElementById('micBtn');
      if (!micActive) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          micActive = true; micBtn.classList.add('active');
          if (dataConn) peer.call(dataConn.peer, localStream);
        } catch(e) { alert("Mic Permission Denied!"); }
      } else {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        micActive = false; micBtn.classList.remove('active');
      }
    }

    function sendGift(emoji) {
      triggerGiftAnimation(emoji);
      if (dataConn) dataConn.send({ type: 'GIFT', emoji: emoji });
    }

    function triggerGiftAnimation(emoji) {
      const el = document.createElement('div');
      el.className = 'flying-gift'; el.innerText = emoji;
      el.style.left = '50%'; el.style.top = '80%';
      document.body.appendChild(el);
      setTimeout(() => { el.style.top = '20%'; el.style.transform = 'scale(2)'; }, 50);
      setTimeout(() => el.remove(), 1000);
    }

    /* --- REAL THREE.JS 3D ENGINE --- */
    let scene, camera, renderer;
    let playerCar, partnerCar;
    let trafficCars = [];
    let speed = 0, currentSpeed = 0;
    let keyLeft = false, keyRight = false, keyBrake = false, keyNitro = false;

    function buildCarModel(colorHex) {
      const group = new THREE.Group();
      
      // Chassis
      const bodyGeo = new THREE.BoxGeometry(1.6, 0.6, 3.2);
      const bodyMat = new THREE.MeshPhongMaterial({ color: colorHex, shininess: 100 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.5;
      group.add(body);

      // Cabin / Roof
      const cabinGeo = new THREE.BoxGeometry(1.2, 0.5, 1.6);
      const cabinMat = new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 80 });
      const cabin = new THREE.Mesh(cabinGeo, cabinMat);
      cabin.position.set(0, 0.9, -0.2);
      group.add(cabin);

      // Wheels
      const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
      const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
      wheelGeo.rotateZ(Math.PI / 2);

      const positions = [[-0.85, 0.3, 1], [0.85, 0.3, 1], [-0.85, 0.3, -1], [0.85, 0.3, -1]];
      positions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.position.set(...pos);
        group.add(wheel);
      });

      // Tail Neon Lights
      const lightGeo = new THREE.BoxGeometry(0.4, 0.1, 0.05);
      const lightMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
      const lightL = new THREE.Mesh(lightGeo, lightMat); lightL.position.set(-0.5, 0.5, 1.6);
      const lightR = new THREE.Mesh(lightGeo, lightMat); lightR.position.set(0.5, 0.5, 1.6);
      group.add(lightL); group.add(lightR);

      return group;
    }

    function init3DGame() {
      const container = document.getElementById('game-container');
      container.innerHTML = '';

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x08020f);
      scene.fog = new THREE.FogExp2(0x08020f, 0.012);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Ambient & Directional Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xff758c, 1.2);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      // Endless Road Plane
      const roadGeo = new THREE.PlaneGeometry(16, 2000);
      const roadMat = new THREE.MeshPhongMaterial({ color: 0x181824 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.z = 900;
      scene.add(road);

      // Neon Track Barriers
      const barrierGeo = new THREE.BoxGeometry(0.4, 0.8, 2000);
      const barrierMat = new THREE.MeshBasicMaterial({ color: 0x00f5d4 });
      const leftB = new THREE.Mesh(barrierGeo, barrierMat); leftB.position.set(-8.2, 0.4, 900);
      const rightB = new THREE.Mesh(barrierGeo, barrierMat); rightB.position.set(8.2, 0.4, 900);
      scene.add(leftB); scene.add(rightB);

      // Spawn Player & Partner
      playerCar = buildCarModel(0xff2a6d);
      playerCar.position.set(-2, 0, 0);
      scene.add(playerCar);

      partnerCar = buildCarModel(0x00f5d4);
      partnerCar.position.set(2, 0, 0);
      scene.add(partnerCar);

      // Traffic Obstacles
      for(let i = 0; i < 15; i++) {
        let tCar = buildCarModel(0xffbb00);
        tCar.position.set((Math.random() - 0.5) * 12, 0, 100 + i * 120);
        scene.add(tCar);
        trafficCars.push(tCar);
      }

      initEngineSound();
      setupInputListeners();
      window.addEventListener('resize', onWindowResize);

      animate3D();
    }

    function setupInputListeners() {
      window.addEventListener('keydown', e => {
        if(e.key === 'ArrowLeft' || e.key === 'a') keyLeft = true;
        if(e.key === 'ArrowRight' || e.key === 'd') keyRight = true;
        if(e.key === 'ArrowDown' || e.key === 's') keyBrake = true;
        if(e.key === 'Shift') keyNitro = true;
      });
      window.addEventListener('keyup', e => {
        if(e.key === 'ArrowLeft' || e.key === 'a') keyLeft = false;
        if(e.key === 'ArrowRight' || e.key === 'd') keyRight = false;
        if(e.key === 'ArrowDown' || e.key === 's') keyBrake = false;
        if(e.key === 'Shift') keyNitro = false;
      });

      const bindBtn = (id, setter) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', e => { e.preventDefault(); setter(true); });
        el.addEventListener('touchend', e => { e.preventDefault(); setter(false); });
      };
      bindBtn('btn-left', v => keyLeft = v);
      bindBtn('btn-right', v => keyRight = v);
      bindBtn('btn-brake', v => keyBrake = v);
      bindBtn('btn-nitro', v => keyNitro = v);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate3D() {
      requestAnimationFrame(animate3D);

      // Speed Dynamics
      let maxCap = keyNitro ? 220 : 160;
      if (keyBrake) speed -= 2.0;
      else if (speed < maxCap) speed += 0.8;

      speed = Math.max(0, speed);
      currentSpeed = speed;

      // Steering Movement
      if (keyLeft && playerCar.position.x > -7.2) playerCar.position.x -= 0.12 * (speed / 80 + 0.2);
      if (keyRight && playerCar.position.x < 7.2) playerCar.position.x += 0.12 * (speed / 80 + 0.2);

      // Forward Progression
      playerCar.position.z += speed * 0.015;

      // Smooth Camera Follow
      camera.position.x = playerCar.position.x * 0.6;
      camera.position.y = playerCar.position.y + 3.2;
      camera.position.z = playerCar.position.z - 7.5;
      camera.lookAt(playerCar.position.x, playerCar.position.y + 1, playerCar.position.z + 10);

      // Traffic Mechanics & Collision
      trafficCars.forEach(tCar => {
        if (tCar.position.z < playerCar.position.z - 20) {
          tCar.position.z = playerCar.position.z + 300 + Math.random() * 200;
          tCar.position.x = (Math.random() - 0.5) * 12;
        }

        // Collision Check
        let dx = Math.abs(tCar.position.x - playerCar.position.x);
        let dz = Math.abs(tCar.position.z - playerCar.position.z);
        if (dx < 1.4 && dz < 2.5) {
          speed = 20; // Crash penalty
        }
      });

      // Sync Partner Car
      if (dataConn && dataConn.open) {
        dataConn.send({ type: 'POS', x: playerCar.position.x, z: playerCar.position.z });
        partnerCar.position.x = remoteCarPos.x;
        partnerCar.position.z = remoteCarPos.z;
      } else {
        // AI Fallback Mode
        partnerCar.position.z += (speed * 0.014);
      }

      // UI Gauges & SFX Updates
      document.getElementById('speedometer').innerText = Math.floor(currentSpeed);
      updateEngineSound(currentSpeed);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
